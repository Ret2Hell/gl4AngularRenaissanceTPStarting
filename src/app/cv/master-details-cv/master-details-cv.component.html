<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Liste des CVs</h5>
        </div>
        <div class="card-body">
          @if (cvsResource.isLoading()) {
            <div class="text-center py-3">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Chargement...</span>
              </div>
            </div>
          } @else {
            <app-list [cvs]="cvsResource.value()"></app-list>
          }
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-secondary text-white">
          <h5 class="mb-0">Détails du CV</h5>
        </div>
        <div class="card-body">
          <router-outlet></router-outlet>

          @if (showPlaceholder()) {
            <div class="text-center text-muted py-5">
              <i class="bi bi-person-circle" style="font-size: 4rem;"></i>
              <h4 class="mt-3">Sélectionnez un CV</h4>
              <p>Cliquez sur un CV dans la liste pour voir ses détails</p>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
