<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Liste des CVs</h5>
        </div>
        <div class="card-body">
          <app-list [cvs]="cvs$ | async"></app-list>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-secondary text-white">
          <h5 class="mb-0">Détails du CV</h5>
        </div>
        <div class="card-body">
          <router-outlet></router-outlet>
          
          <ng-container *ngIf="router.url === '/cv/list'">
            <div class="text-center text-muted py-5">
              <i class="bi bi-person-circle" style="font-size: 4rem;"></i>
              <h4 class="mt-3">Sélectionnez un CV</h4>
              <p>Cliquez sur un CV dans la liste pour voir ses détails</p>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
