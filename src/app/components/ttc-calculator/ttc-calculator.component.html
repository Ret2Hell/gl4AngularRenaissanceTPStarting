<div class="ttc-calculator-container">
  <div class="ttc-calculator-title">TTC Calculator</div>
  
  <form [formGroup]="calculatorForm" class="form-row">
    <div>
      <input 
        type="number" 
        class="form-input" 
        placeholder="100" 
        step="0.01" 
        min="0"
        formControlName="unitPrice">
      <div class="form-label">Prix HT</div>
    </div>
    <div>
      <input 
        type="number" 
        class="form-input" 
        placeholder="10" 
        min="1" 
        step="1"
        formControlName="quantity">
      <div class="form-label">Quantité</div>
    </div>
    <div>
      <input 
        type="number" 
        class="form-input" 
        placeholder="18" 
        min="0" 
        max="100" 
        step="0.1"
        formControlName="tva">
      <div class="form-label">TVA</div>
    </div>
  </form>

  <div class="result-row" *ngIf="calculationResults$ | async as results">
    <div class="result-box bg-unit-price">
      <h6>Prix unitaire TTC</h6>
      <div class="value">€{{ results.ttcPricePerUnit.toFixed(2) }}</div>
    </div>
    <div class="result-box bg-total-price">
      <h6>Prix total TTC</h6>
      <div class="value">€{{ results.ttcPrice.toFixed(2) }}</div>
    </div>
    <div class="result-box bg-discount">
      <h6>Discount</h6>
      <div class="value">€{{ results.discountAmount.toFixed(2) }}</div>
    </div>
  </div>
</div>
