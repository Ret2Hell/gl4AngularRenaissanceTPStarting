<div class="ttc-calculator-container">
  <div class="ttc-calculator-title">TTC Calculator (Signal-Based)</div>
  
  <div class="form-row">
    <div>
      <input 
        type="number" 
        class="form-input" 
        placeholder="100" 
        step="0.01" 
        min="0"
        [ngModel]="unitPrice()"
        (ngModelChange)="unitPrice.set($event)">
      <div class="form-label">Prix HT</div>
    </div>
    <div>
      <input 
        type="number" 
        class="form-input" 
        placeholder="10" 
        min="1" 
        step="1"
        [ngModel]="quantity()"
        (ngModelChange)="quantity.set($event)">
      <div class="form-label">Quantité</div>
    </div>
    <div>
      <input 
        type="number" 
        class="form-input" 
        placeholder="18" 
        min="0" 
        max="100" 
        step="0.1"
        [ngModel]="tva()"
        (ngModelChange)="tva.set($event)">
      <div class="form-label">TVA</div>
    </div>
  </div>

  <div class="result-row">
    <div class="result-box bg-unit-price">
      <h6>Prix unitaire TTC</h6>
      <div class="value">€{{ ttcPricePerUnit().toFixed(2) }}</div>
    </div>
    <div class="result-box bg-total-price">
      <h6>Prix total TTC</h6>
      <div class="value">€{{ ttcPrice().toFixed(2) }}</div>
    </div>
    <div class="result-box bg-discount">
      <h6>Discount ({{ discount() }}%)</h6>
      <div class="value">€{{ discountAmount().toFixed(2) }}</div>
    </div>
  </div>
</div>
