<div class="container-fluid">
  <!-- Date Banner -->
  <div class="row">
    <div class="col-12">
      <div class="alert alert-warning">
        {{ date | date : "full" | uppercase }}
      </div>
    </div>
  </div>

  <!-- Search Section -->
  <div class="row mb-4">
    <div class="col-12">
      <app-autocomplete></app-autocomplete>
    </div>
  </div>

  <!-- CV List and Card Section -->
  <div class="row">
    <div class="col">
      <h4 class="mb-3">All CVs</h4>
      <app-list [cvs]="cvs$ | async"></app-list>
    </div>
    <div class="col">
      <app-cv-card [cv]="selectedCv"></app-cv-card>
    </div>
  </div>
</div>

<div #embaucheSentinel class="mt-3" style="min-height: 1px;"></div>

<div *ngIf="!embaucheRequested && !loading && !error" class="alert alert-info mt-2">
  Embauche se chargera lorsqu'elle sera visible…
</div>

<div *ngIf="loading" class="alert alert-secondary mt-2">Chargement d'Embauche…</div>

<div *ngIf="error" class="alert alert-danger mt-2">Échec du chargement d'Embauche.</div>

<ng-container *ngIf="embaucheCmp" [ngComponentOutlet]="embaucheCmp"></ng-container>
